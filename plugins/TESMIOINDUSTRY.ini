; TESMIOINDUSTRY 0.1.0 | TESMIO API 4 | WRSR 1.1.1.9 tested target
; All multipliers: finite 0.05 .. 20. Restart the game after changes.
; Actual input = baseline * efficiency * input.
; Actual output = baseline * efficiency * output.
; Per-second utilities = baseline * efficiency * utility.
; Global, category and building factors multiply each other.
